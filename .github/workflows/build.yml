name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The browser tests use the production build in dist/, desktop and phone layouts and the standalone file.
      - name: Install the test browser
        run: |
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(node -e 'import("@playwright/test").then(m=>console.log(m.chromium.executablePath()))')" >> "$GITHUB_ENV"
      - run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Builds can finish out of order. Recheck main after acquiring the Pages deployment lock.
      - name: Check the current main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! $main_sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the main branch commit"
            exit 1
          fi
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_SHA != "$main_sha" ]]; then
            echo "::notice::Skipping Pages publication of $GITHUB_SHA because main is now $main_sha"
          fi
      - id: deployment
        if: steps.main.outputs.sha == github.sha
        uses: actions/deploy-pages@v5
