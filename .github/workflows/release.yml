name: Release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to build or repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Validate release metadata
        run: node release-tools/scripts/release-assets.mjs validate source
      - run: npm ci
        working-directory: source
      - run: npm test
        working-directory: source
      - run: npm run build
        working-directory: source
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node release-tools/scripts/release-assets.mjs publish source
